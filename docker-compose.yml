version: '3.8'

services:
  # 1. PostgreSQL Database Service (Tuned for High Concurrency)
  postgres:
    image: postgres:16-alpine
    container_name: dolsyx_postgres
    restart: always
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB -c maintenance_work_mem=64MB
    environment:
      POSTGRES_USER: dolsyx_user
      POSTGRES_PASSWORD: dolsyx_secure_password_2026
      POSTGRES_DB: dolsyx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolsyx_user -d dolsyx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Key-Value & Pub/Sub Service (Multi-Node Socket & Job Distribution)
  redis:
    image: redis:7-alpine
    container_name: dolsyx_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Express Node.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dolsyx_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://dolsyx_user:dolsyx_secure_password_2026@postgres:5432/dolsyx_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dolsyx_production_super_secret_jwt_key_2026"
      CLIENT_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  # 4. Next.js Web Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dolsyx_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
