version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: dolsyx_postgres
    restart: always
    environment:
      POSTGRES_USER: dolsyx_user
      POSTGRES_PASSWORD: dolsyx_secure_password_2026
      POSTGRES_DB: dolsyx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolsyx_user -d dolsyx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express Node.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dolsyx_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://dolsyx_user:dolsyx_secure_password_2026@postgres:5432/dolsyx_db?schema=public"
      JWT_SECRET: "dolsyx_production_super_secret_jwt_key_2026"
      CLIENT_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  # 3. Next.js 14 Web Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dolsyx_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
