<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a0d2a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d0b0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dbb88a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c0a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d1b08;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>
  <!-- Body / Top -->
  <path d="M18 200 C18 148 55 126 100 126 C145 126 182 148 182 200Z" fill="url(#bodyGrad)"/>
  <!-- V-neck collar detail -->
  <path d="M86 126 L100 148 L114 126Z" fill="#6d28d9"/>
  <!-- Neck -->
  <rect x="89" y="108" width="22" height="22" rx="5" fill="url(#skinGrad)"/>
  <!-- Hair back (flowing) -->
  <ellipse cx="100" cy="74" rx="40" ry="46" fill="url(#hairGrad)"/>
  <!-- Hair sides flowing down -->
  <path d="M60 74 C52 90 50 115 58 132 C62 118 62 95 68 78Z" fill="url(#hairGrad)"/>
  <path d="M140 74 C148 90 150 115 142 132 C138 118 138 95 132 78Z" fill="url(#hairGrad)"/>
  <!-- Head (face) -->
  <ellipse cx="100" cy="84" rx="32" ry="36" fill="url(#skinGrad)"/>
  <!-- Hair top fringe -->
  <path d="M68 72 C66 48 82 34 100 34 C118 34 134 48 132 72 C128 56 72 56 68 72Z" fill="url(#hairGrad)"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="82" rx="5" ry="5.5" fill="#fff"/>
  <ellipse cx="112" cy="82" rx="5" ry="5.5" fill="#fff"/>
  <circle cx="89" cy="83" r="3" fill="#2d1b10"/>
  <circle cx="113" cy="83" r="3" fill="#2d1b10"/>
  <!-- Lashes left -->
  <path d="M83 78 L82 74 M86 77 L85 73 M89 77 L89 73" stroke="#2d1b10" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Lashes right -->
  <path d="M107 78 L106 74 M110 77 L109 73 M113 77 L113 73" stroke="#2d1b10" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Subtle smile -->
  <path d="M91 99 Q100 106 109 99" stroke="#c49070" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
