[build]
builder = "NIXPACKS"
buildCommand = "npm run install:all && npm run build && cd backend && npx prisma generate"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "DOLSYX"
