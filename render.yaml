services:
  # Monolith Web Service (Hosts backend and proxies Next.js standalone frontend)
  - type: web
    name: dolsyx-monolith
    runtime: node
    # Build command builds both backend and frontend, then builds backend output
    buildCommand: npm install && cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build && npx prisma generate && npx prisma db push
    startCommand: cd backend && NODE_ENV=production node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
